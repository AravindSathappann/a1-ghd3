<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My first visualization</title>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
     const svg = d3.select("#container").append("svg").attr("width", 600).attr("height", 400).style("background", "lightblue");

    // Rectangle: House
    svg.append("rect").attr("x", 200).attr("y", 180).attr("width", 200).attr("height", 170).attr("fill", "lightcoral");

    // Additional Shape: Roof
    svg.append("polygon").attr("points", "180,180 300,80 420,180").attr("fill", "brown");

    // Rectangle: Door
    svg.append("rect").attr("x", 275).attr("y", 270).attr("width", 50).attr("height", 80).attr("fill", "green")

    // Circle: Sun
    const sun = svg.append("circle").attr("cx", 500).attr("cy", 70).attr("r", 40).attr("fill", "yellow");

    // Line: Ground
    svg.append("line").attr("x1", 0).attr("y1", 350).attr("x2", 600).attr("y2", 350).attr("stroke", "green").attr("stroke-width", 6);

    // Additional Circle: Door Handle
    svg.append("circle").attr("cx", 315).attr("cy", 310).attr("r", 5).attr("fill", "gold");

    // Interactive feature
    sun.on("click", function() {
       currentColor = sun.attr("fill");
      if (currentColor === "yellow") {
        sun.attr("fill", "orange");
      } else {
        sun.attr("fill", "green");
      } 
    });
  </script>
</body>
</html>
